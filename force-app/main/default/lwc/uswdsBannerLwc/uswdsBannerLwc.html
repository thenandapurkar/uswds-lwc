<template>
    <section class="banner" aria-label="Official website of the United States government">

        <!-- Collapsed header bar -->
        <header class="banner-header">
            <div class="banner-inner">

                <!-- US Flag SVG -->
                <div class="banner-flag" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" class="flag-svg">
                        <path fill="#DB3E1F" d="M32 10h32v4H32zM32 18h32v4H32zM32 26h32v4H32zM32 34h32v4H32zM0 42h64v4H0zM0 50h64v4H0z"></path>
                        <path fill="#ffffff" d="M32 14h32v4H32zM32 22h32v4H32zM32 30h32v4H32zM0 46h64v4H0zM0 38h64v4H0z"></path>
                        <path fill="#1D33B1" d="M0 10h32v28H0z"></path>
                        <path fill="#ffffff" d="M4 14h4v4H4zM8 22h4v4H8zM4 30h4v4H4zM12 14h4v4h-4zM16 22h4v4h-4zM12 30h4v4h-4zM20 14h4v4h-4zM24 22h4v4h-4zM20 30h4v4h-4z"></path>
                    </svg>
                </div>

                <!-- Header text and toggle -->
                <div class="banner-header-body">
                    <p class="banner-header-text">An official website of the United States government</p>
                    <button type="button"
                            class="banner-button"
                            aria-expanded={ariaExpanded}
                            aria-controls="gov-banner-content"
                            onclick={handleToggle}>
                        <span class="banner-button-text">Here&rsquo;s how you know</span>
                        <svg class="banner-chevron" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"></path>
                        </svg>
                    </button>
                </div>

            </div>
        </header>

        <!-- Expandable content panel -->
        <template if:true={isExpanded}>
            <div id="gov-banner-content" class="banner-content">
                <div class="banner-guidance-row">

                    <!-- .gov guidance -->
                    <div class="banner-guidance">
                        <div class="banner-guidance-icon icon-gov" aria-hidden="true">
                            <svg focusable="false" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M4 10h3v7H4zm6.5 0h3v7h-3zM2 19h20v3H2zm15-9h3v7h-3zm-5-9L2 6v2h20V6z"></path>
                            </svg>
                        </div>
                        <div class="banner-guidance-body">
                            <p class="banner-guidance-heading">
                                <strong>Official websites use .gov</strong>
                            </p>
                            <p class="banner-guidance-text">
                                A <strong>.gov</strong> website belongs to an official government organization in the United States.
                            </p>
                        </div>
                    </div>

                    <!-- HTTPS guidance -->
                    <div class="banner-guidance">
                        <div class="banner-guidance-icon icon-https" aria-hidden="true">
                            <svg focusable="false" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path>
                            </svg>
                        </div>
                        <div class="banner-guidance-body">
                            <p class="banner-guidance-heading">
                                <strong>Secure .gov websites use HTTPS</strong>
                            </p>
                            <p class="banner-guidance-text">
                                A <strong>lock</strong> (
                                <svg class="inline-lock" aria-hidden="true" focusable="false" viewBox="0 0 52 64">
                                    <path fill="currentColor" d="M26 0c10.493 0 19 8.507 19 19v9h3a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V32a4 4 0 0 1 4-4h3v-9C7 8.507 15.507 0 26 0zm0 8c-5.979 0-10.843 4.77-10.996 10.712L15 19v9h22v-9c0-6.075-4.925-11-11-11z"></path>
                                </svg>
                                ) or <strong>https://</strong> means you&rsquo;ve safely connected to the .gov website. Share sensitive information only on official, secure websites.
                            </p>
                        </div>
                    </div>

                </div>
            </div>
        </template>

    </section>
</template>
